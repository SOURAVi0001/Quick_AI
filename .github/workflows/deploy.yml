name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/quickai-backend:${{ github.sha }} -t ${{ secrets.DOCKER_USERNAME }}/quickai-backend:latest ./server
          docker push ${{ secrets.DOCKER_USERNAME }}/quickai-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/quickai-backend:latest

      - name: Copy K8s manifests to Oracle VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: 'K8s/*'
          target: '/home/opc/deployments/quickai'

      - name: Deploy to K8s on Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: SERVER_ENV
          script: |
            # 1. Create or update Kubernetes Secret securely from GitHub Secret (if provided)
            if [ -n "$SERVER_ENV" ]; then
              echo "$SERVER_ENV" > /tmp/.quickai_secrets.env
              kubectl create secret generic quickai-secrets \
                --from-env-file=/tmp/.quickai_secrets.env \
                --dry-run=client -o yaml | kubectl apply -f -
              rm -f /tmp/.quickai_secrets.env
            elif ! kubectl get secret quickai-secrets >/dev/null 2>&1; then
              # Create placeholder if not exists so pod creation does not fail
              kubectl create secret generic quickai-secrets
            fi

            # 2. Apply manifests copied from checked-out repo
            kubectl apply -f /home/opc/deployments/quickai/K8s/

            # 3. Roll out the exact immutable SHA image to the Deployment
            kubectl set image deployment/quickai-backend quickai-backend=${{ secrets.DOCKER_USERNAME }}/quickai-backend:${{ github.sha }}

            # 4. Block and verify rollout status (fails if unhealthy)
            kubectl rollout status deployment/quickai-backend --timeout=180s
