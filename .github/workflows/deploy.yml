name: Deploy Full Stack App

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client_3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}

      - name: Upload to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/quickai-backend:${{ github.sha }} -t ${{ secrets.DOCKER_USERNAME }}/quickai-backend:latest ./server
          docker push ${{ secrets.DOCKER_USERNAME }}/quickai-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/quickai-backend:latest

      - name: Deploy to K8s on Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # Pull latest changes in the repository on server if it is a git repo
            if [ -d "/home/opc/Quick_AI/.git" ]; then
              cd /home/opc/Quick_AI
              git pull origin main || true
            fi

            # Automatically create or update Kubernetes Secret from the server's .env file
            if [ -f "/home/opc/Quick_AI/server/.env" ]; then
              kubectl create secret generic quickai-secrets \
                --from-env-file=/home/opc/Quick_AI/server/.env \
                --dry-run=client -o yaml | kubectl apply -f -
            fi

            # Apply all Kubernetes manifests (ConfigMap, Deployment, Service)
            kubectl apply -f /home/opc/Quick_AI/K8s/

            # Trigger zero-downtime rolling update with the newly built SHA-tagged image
            kubectl set image deployment/quickai-backend quickai-backend=${{ secrets.DOCKER_USERNAME }}/quickai-backend:${{ github.sha }}

            # Wait for rollout to complete (fails step if deployment fails)
            kubectl rollout status deployment/quickai-backend --timeout=180s
