name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/quickai-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/quickai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy K8s manifests to Oracle VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: 'K8s/*'
          target: '/home/opc/deployments/quickai'

      - name: Deploy to K8s on Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: SERVER_ENV
          script: |
            if [ -n "$SERVER_ENV" ]; then
              echo "$SERVER_ENV" > /tmp/.quickai_secrets.env
              kubectl create secret generic quickai-secrets \
                --from-env-file=/tmp/.quickai_secrets.env \
                --dry-run=client -o yaml | kubectl apply -f -
              rm -f /tmp/.quickai_secrets.env
            elif ! kubectl get secret quickai-secrets >/dev/null 2>&1; then
              kubectl create secret generic quickai-secrets
            fi

            kubectl apply -f /home/opc/deployments/quickai/K8s/

            kubectl set image deployment/quickai-backend \
              quickai-backend=${{ secrets.DOCKER_USERNAME }}/quickai-backend:${{ github.sha }}

            kubectl rollout status deployment/quickai-backend --timeout=180s