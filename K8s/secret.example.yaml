# Example template for quickai-secrets
# Real secrets are generated automatically on the server from /home/opc/Quick_AI/server/.env
# using: kubectl create secret generic quickai-secrets --from-env-file=/home/opc/Quick_AI/server/.env --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: quickai-secrets
type: Opaque
stringData:
  CLERK_PUBLISHABLE_KEY: "your-clerk-publishable-key"
  CLERK_SECRET_KEY: "your-clerk-secret-key"
  DATABASE_URL: "your-neon-postgres-url"
  REDIS_URL: "your-redis-url"
  GEMINI_API_KEY: "your-gemini-key"
  OPENROUTER_API_KEY: "your-openrouter-key"
  CLIPDROP_API_KEY: "your-clipdrop-key"
  CLOUDINARY_CLOUD_NAME: "your-cloudinary-name"
  CLOUDINARY_API_KEY: "your-cloudinary-key"
  CLOUDINARY_API_SECRET: "your-cloudinary-secret"
